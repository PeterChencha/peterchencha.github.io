name: route-guard

# Surfaces branch-model violations. It cannot block a merge on GitHub Free
# private repositories, so it is a signal for the PR Worker and for review.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate source -> target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 - <<'PY'
          import os, sys
          head = os.environ["HEAD_REF"]
          base = os.environ["BASE_REF"]
          labels = {x.strip() for x in os.environ.get("LABELS", "").split(",") if x.strip()}
          prefixes = ("feature/", "fix/", "docs/", "chore/", "refactor/", "test/", "dependabot/")
          if base == "main":
              ok = head == "dev" or head.startswith("hotfix/")
              expected = "dev or hotfix/*"
          elif base == "dev":
              if head == "main" and "reconcile" in labels:
                  ok, expected = True, "main (reconcile)"
              else:
                  ok = any(head.startswith(p) and len(head) > len(p) for p in prefixes)
                  expected = ", ".join(p + "*" for p in prefixes)
          else:
              ok, expected = False, "dev or main"
          if not ok:
              print(f"::error::{head} -> {base} is not an approved route (expected {expected} -> {base})")
              sys.exit(1)
          print(f"route ok: {head} -> {base}")
          PY

